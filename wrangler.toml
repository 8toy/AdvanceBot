name = "auto-reaction-bot"
main = "api/worker.js"
compatibility_date = "2026-10-02"

[[d1_databases]]
binding = "DB"
database_name = "reaction-bot"
database_id = "demo"

[[queues.producers]]
binding = "BROADCAST_QUEUE"
queue = "broadcast-queue"

[[queues.consumers]]
queue = "broadcast-queue"
max_batch_size = 1
max_concurrency = 1
max_retries = 1



