services:
  - type: web
    name: auto-reaction-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node api/index.js
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: EMOJI_LIST
        sync: false
      - key: RESTRICTED_CHATS
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: UPDATES_URL
        sync: false
      - key: SUPPORT_URL
        sync: false
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /
    disk:
      name: bot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    autoDeploy: false
